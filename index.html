<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GƏNC İSTEDADLAR LİSEYİ - STUDENT SYSTEM MANAGEMENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOGIN VIEW ===================== -->
<div id="loginView" class="login-screen">
  <div class="login-atmosphere"></div>
  <div class="login-card">
    <div class="login-mark">
             <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzAQ83gNrDXHgxr1x226E03xNtAU5AVYkU2FyheoR8Hw&s" alt="Logo" class="brand-logo">

    </div>
    <p class="login-eyebrow">GƏNC İSTEDADLAR LİSEYİ · Классный журнал</p>
    <h1 class="login-title">С возвращением</h1>
    <p class="login-sub">Войдите под своим логином, чтобы открыть журнал</p>

    <form id="loginForm" class="login-form">
      <label class="field">
        <span>Логин</span>
        <input type="text" id="loginInput" autocomplete="username" placeholder="например, admin" required>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input type="password" id="passwordInput" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <p id="loginError" class="login-error"></p>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
<!-- 
    <div class="login-hint">
      <span class="dot"></span>
      Первый вход администратора: <b>admin</b> / <b>admin2026</b>
    </div> -->
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="appShell" class="app-shell hidden">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzAQ83gNrDXHgxr1x226E03xNtAU5AVYkU2FyheoR8Hw&s" alt="Logo" class="brand-logo">
        <span>GİL</span>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-bottom">
      <div class="mini-profile" id="miniProfile"></div>
      <button id="logoutBtn" class="btn btn-ghost btn-block">Выйти</button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button class="burger" id="burgerBtn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
      <h2 id="pageTitle">Обзор</h2>
      <div class="topbar-right">
        <span class="today-chip" id="todayChip"></span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
